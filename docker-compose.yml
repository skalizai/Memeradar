services:
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      FIXTURES_DIR: /app/fixtures
      # Bind inside the container; the port is published to localhost only below
      HEALTH_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${HEALTH_PORT:-8787}:${HEALTH_PORT:-8787}"
    volumes:
      - ./fixtures:/app/fixtures
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  redis-data:
